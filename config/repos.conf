#!/bin/bash
# Configuration file for multi-repo profiles
# Edit this file to customize your repository groups

# ============================================================================
# WORKSPACE CONFIGURATION
# ============================================================================

# Where your repositories live (adjust to your setup)
# Examples: $HOME/dev, $HOME/projects, $HOME/code, $HOME/workspace
WORKSPACE_DIR="$HOME/dev"

# Where to create symlinks (defaults to WORKSPACE_DIR if not set)
# Can be different from WORKSPACE_DIR if you want symlinks elsewhere
SYMLINK_DIR="${SYMLINK_DIR:-$WORKSPACE_DIR}"

# IMPORTANT: If you install claude-multi-thread in a different location,
# update the path in your ~/.zshrc or ~/.bashrc:
# source $HOME/your-location/claude-multi-thread/config/aliases.sh

# ============================================================================
# REPOSITORY DEFINITIONS
# ============================================================================

# Define your repositories with their base paths and default ports
# Use $WORKSPACE_DIR variable or absolute paths
declare -A REPOS=(
    # Nuela ecosystem
    ["nuela-next"]="$WORKSPACE_DIR/nuela-next:3000"
    ["nuela-apiv2"]="$WORKSPACE_DIR/nuela-apiv2:3003"
    ["nuela-ai"]="$WORKSPACE_DIR/nuela-ai:3001"

    # Add more repositories here:
    # ["my-frontend"]="$WORKSPACE_DIR/frontend:4000"
    # ["my-backend"]="$HOME/projects/backend:4001"  # Can use absolute paths too
)

# ============================================================================
# PREDEFINED PROFILES
# ============================================================================

# Define groups of repositories that work together
declare -A PROFILES=(
    ["frontend-backend"]="nuela-next,nuela-apiv2"
    ["full-stack"]="nuela-next,nuela-apiv2,nuela-ai"
    ["api-only"]="nuela-apiv2,nuela-ai"

    # Add more profiles here:
    # ["my-stack"]="my-frontend,my-backend"
)

# ============================================================================
# ENVIRONMENT VARIABLE MAPPINGS
# ============================================================================

# Define which env vars need to be updated between services
# Format: "repo:ENV_VAR_NAME:target_repo:target_port_offset"
# This means: in 'repo', update ENV_VAR_NAME to point to 'target_repo' URL

ENV_MAPPINGS=(
    # nuela-next needs to point to nuela-apiv2
    "nuela-next:NEXT_PUBLIC_SOCKET_URL:nuela-apiv2:0"

    # nuela-apiv2 needs to point to nuela-ai
    "nuela-apiv2:NUELA_AI_URL:nuela-ai:0"

    # Add more mappings here:
    # "my-frontend:REACT_APP_API_URL:my-backend:0"
    # "my-backend:AI_SERVICE_URL:my-ai:0"
)

# ============================================================================
# PORT OFFSET CONFIGURATION
# ============================================================================

# Port increments for each instance
# Instance 1 will use base_port + PORT_INCREMENT * 1
# Instance 2 will use base_port + PORT_INCREMENT * 2
# etc.
PORT_INCREMENT=1000

# ============================================================================
# DEPENDENCY INSTALLATION
# ============================================================================

# Auto-install dependencies for these repos
AUTO_INSTALL_DEPS=(
    # "nuela-next"
    # "nuela-apiv2"
    # Add repos that should auto-install dependencies
)
